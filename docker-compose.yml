services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: tique-helpdesk:latest
    container_name: tique-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: "${APP_NAME:-Helpdesk Tiqé}"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${APP_URL}"
      APP_KEY: "${APP_KEY}"
      LOG_CHANNEL: stderr
      LOG_LEVEL: "${LOG_LEVEL:-warning}"

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-tique_helpdesk}"
      DB_USERNAME: "${DB_USERNAME:-tique}"
      DB_PASSWORD: "${DB_PASSWORD}"

      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database

      MAIL_MAILER: "${MAIL_MAILER:-log}"
      MAIL_HOST: "${MAIL_HOST:-}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_ENCRYPTION: "${MAIL_ENCRYPTION:-tls}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-no-reply@softara.tech}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-Tiqé}"

      RUN_SEEDERS: "${RUN_SEEDERS:-0}"
    volumes:
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs
    ports:
      - "${APP_PORT:-8080}:80"
    networks:
      - tique

  db:
    image: mysql:8.0
    container_name: tique-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-tique_helpdesk}"
      MYSQL_USER: "${DB_USERNAME:-tique}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - tique

volumes:
  db_data:
  app_storage:
  app_logs:

networks:
  tique:
    driver: bridge
